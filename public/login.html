<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Terminal — Unlock</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #lock-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: min(300px, 88vw);
    }

    #lock-icon {
      font-size: 1.6rem;
      opacity: 0.35;
      user-select: none;
    }

    #lock-box form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #lock-box input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      font-family: inherit;
      font-size: 15px;
      background: var(--bg-raised);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      text-align: center;
      letter-spacing: 3px;
      transition: border-color 0.15s;
    }
    #lock-box input[type="password"]:focus {
      border-color: var(--accent);
    }
    #lock-box input[type="password"]::placeholder {
      letter-spacing: normal;
      color: var(--text-dim);
    }

    #error-msg {
      font-size: 12px;
      color: #c0504d;
      text-align: center;
      min-height: 16px;
    }

    #hint {
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div id="lock-box">
    <span id="lock-icon">&#9201;</span>
    <form method="POST" action="/login">
      <input
        type="password"
        name="password"
        placeholder="password"
        autofocus
        autocomplete="current-password"
      />
      <p id="error-msg"></p>
    </form>
    <span id="hint">press Enter to unlock</span>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('error-msg').textContent = 'wrong password';
    }
  </script>
</body>
</html>
